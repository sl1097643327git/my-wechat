[project]
name = "wechat-overlay-python"
version = "0.1.0"
description = "我的微信：Windows 桌面微信聊天记录本地加密辅助工具"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
    "pywinauto>=0.6.8",
    "pyperclip>=1.8.2",
    "psutil>=5.9.0",
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["python_tests"]
pythonpath = ["."]
